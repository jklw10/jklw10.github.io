<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    /* CSS Variables for easy color tweaking */
    :root {
      --primary-color: #2563eb;
      --text-color: #1f2937;
      --secondary-text: #4b5563;
      --bg-color: #ffffff;
      --border-color: #e5e7eb;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-stack);
      color: var(--text-color);
      background-color: #f3f4f6;
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .cv-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--bg-color);
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    /* Target standard Markdown HTML elements */
    h1 {
      font-size: 2.25rem;
      color: var(--text-color);
      line-height: 1.2;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    h3 {
      font-size: 1.05rem;
      color: var(--text-color);
      margin-top: 1.25rem;
      margin-bottom: 0.2rem;
    }

    p {
      color: var(--secondary-text);
      margin-bottom: 0.5rem;
    }

    /* Subtitle under Name (first paragraph after h1) */
    h1 + p {
      font-size: 1.2rem;
      color: var(--primary-color);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    a {
      color: var(--primary-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    ul {
      padding-left: 1.2rem;
      margin-bottom: 1rem;
      color: var(--secondary-text);
    }

    li {
      margin-bottom: 0.35rem;
    }

    /* Horizontal lines in Markdown (---) */
    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 1.5rem 0;
    }

    /* Italics used for Dates/Company names in markdown */
    em {
      font-style: normal;
      color: var(--secondary-text);
      font-size: 0.9rem;
    }

    /* Print Stylesheet */
    @media print {
      body { background-color: #fff; padding: 0; }
      .cv-container { box-shadow: none; padding: 0; max-width: 100%; }
      h2, h3, li { page-break-inside: avoid; }
      a { text-decoration: none; color: var(--text-color); }
    }

    @media (max-width: 600px) {
      .cv-container { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="cv-container">
    {{ content }}
  </div>
</body>
</html>
