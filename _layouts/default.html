<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
  /* -------------------------------------------------------------
     THEME PALETTE (Extracted from 3D Scene Banner)
  ------------------------------------------------------------- */
  :root {
    --primary-color: #808ce3;      /* Periwinkle sky blue (headings & links) */
    --primary-hover: #9fa8ee;      /* Lighter periwinkle for hover states */
    --accent-color: #bfa868;       /* Golden olive/tan from terrain highlights */
    --text-color: #e2e5f8;         /* Crisp pale lavender-white for text */
    --secondary-text: #9aa0c4;     /* Soft slate-lavender for subtitles/dates */
    --bg-color: #10121b;          /* Deep midnight periwinkle page background */
    --card-bg: #181a28;           /* Slate container background */
    --border-color: #2b2e46;       /* Subtle dark purple-slate borders */
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Reset & Base Styles */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-stack);
    color: var(--text-color);
    background-color: var(--bg-color);
    line-height: 1.6;
    padding: 2rem 1rem;
  }

  .cv-container {
    max-width: 800px;
    margin: 0 auto;
    background: var(--card-bg);
    padding: 3rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }

  /* Headings & Text */
  h1 {
    font-size: 2.25rem;
    color: var(--text-color);
    margin-bottom: 0.75rem;
  }

  h2 {
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--primary-color);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.25rem;
    margin-top: 2rem;
    margin-bottom: 1rem;
  }

  h3 {
    font-size: 1.05rem;
    color: var(--text-color);
    margin-top: 1.25rem;
    margin-bottom: 0.2rem;
  }

  p {
    color: var(--secondary-text);
    margin-bottom: 0.5rem;
  }

  /* Subtitle under Name */
  h1 + img + p, h1 + p {
    font-size: 1.1rem;
    color: var(--secondary-text);
    margin-top: 0.75rem;
    margin-bottom: 0.5rem;
  }

  a {
    color: var(--primary-color);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  a:hover {
    color: var(--primary-hover);
    text-decoration: underline;
  }

  ul {
    padding-left: 1.2rem;
    margin-bottom: 1rem;
    color: var(--secondary-text);
  }

  li {
    margin-bottom: 0.35rem;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--border-color);
    margin: 1.5rem 0;
  }

  em {
    font-style: normal;
    color: var(--secondary-text);
    font-size: 0.9rem;
  }

  /* Banner image rounding */
  img {
    border-radius: 4px;
    border: 1px solid var(--border-color);
  }

  /* Print Stylesheet */
  @media print {
    body { background-color: #fff; color: #000; padding: 0; }
    .cv-container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
    h2 { color: #000; border-bottom: 1px solid #ccc; }
    a { color: #000; }
  }

  @media (max-width: 600px) {
    .cv-container { padding: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="cv-container">
    {{ content }}
  </div>
</body>
</html>
